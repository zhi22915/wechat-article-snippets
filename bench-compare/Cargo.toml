[package]
name = "bench-compare"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
wincode = { version = "0.6.3", features = ["std", "derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
